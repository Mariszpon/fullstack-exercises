<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="resposta.css">
    <link rel="stylesheet" href="style.css">
    <!-- Importando Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!--Formulário-->
        <div class="form-container">
            <div class="login-cadastro">
                <!--Formulário de Login-->
                <form  class="sign-in-form">
                    <h2 class="title">Login</h2>
                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="usuario" placeholder="Nome de Usuário">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="senha" placeholder="Senha">
                    </div>
                    <input type="submit" value="Login" class="btn solid">
                    <p class="social-text">Ou entre com suas redes sociais</p>
                    <div class="social-media">
                        <a href="#" class="social-icon">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fab fa-google"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                    </div>
                </form>

                <!--Formulário de Cadastro-->
                <form method="POST" class="sign-up-form">
                    <h2 class="title">Cadastro</h2>

                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="usuario" placeholder="Nome de Usuário">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" placeholder="Email">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" name="telefone" placeholder="Número de Telefone">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-calendar"></i>
                        <input type="date" name="nascimento" placeholder="Data de nascimento">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="senha" placeholder="Senha">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="confirmacao" placeholder="Confirmação de senha">
                    </div>
                    <input type="submit" value="Cadastro" class="btn">
                    
                    <p class="social-text">Ou entre com suas redes sociais</p>
                    <div class="social-media">
                        <a href="#" class="social-icon">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fab fa-google"></i>
                        </a>
                        <a href="#" class="social-icon">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                    </div>
                </form>

            </div>
        </div>

        <!--Paineis-->
        <div class="panels-container">
            <!--Painel da esquerda-->
            <div class="panel left-panel">
                <div class="content">
                    <h3>Não tem uma conta?</h3>
                    <p>Cadastre-se para ter acesso a todas as funcionalidades do nosso site.</p>
                    <button class="btn transparent" id="sign-up-btn">Cadastro</button>
                </div>
                <img src="cat.png" class="image" alt="">
            </div>

            <!--Painel da direita-->
            <div class="panel right-panel">
                <div class="content">
                    <h3>Já tem uma conta?</h3>
                    <p>Faça login para acessar sua conta e aproveitar todos os recursos disponíveis.</p>
                    <button class="btn transparent" id="sign-in-btn">Login</button>
                </div>
                <img src="cat2.png" class="image" alt="">
            </div>
        </div>
    </div>
<script src="index.js"></script>
</body>
</html>

<!--Aprendizado
Site de ícones: https://fontawesome.com/icons
Obs: Importe <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

name="" → Identificação dos dados enviados  

<form> → Cria um formulário e empacota esses dados e os envia pra um servidor ou um endereço de processamento na web.

value → Atributo que define o valor de um elemento, como o texto exibido em um botão ou o valor de um campo de entrada.

action="" → define pra onde os dados do formulário vão ser enviados quando o usuário clicar em "submit".
Se está vazio (""), significa que o formulário não tem destino definido ainda. Normalmente você colocaria aqui uma URL ou um arquivo PHP, tipo action="login.php".
Com vazio, ele só recarrega a mesma página.

"#" no <a href="#" class="social-icon"> e outros → o # sozinho não aponta pra lugar nenhum específico, ele só “volta pro topo da página” ou não faz nada.
É usado como placeholder quando você ainda não tem o link real.
Também pode ser usado quando o link vai ser controlado por JavaScript (por exemplo, abrir um modal ou executar uma função).
-->
